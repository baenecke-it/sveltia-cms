name: Create Github Release and Deploy to SingTonic

on:
  push:
    tags:
      - '*' # Trigger only on push of any tag

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm and Node.js
        uses: pnpm/setup@v2.1.0
        with:
          version: latest
          runtime: node@26
          cache: true

      - name: Install dependencies
        run: pnpm ci

      - name: Build Svelte project
        run: pnpm run build

      - name: Package pnpm artifact
        run: |
          TARBALL="sveltia-cms-${{ github.ref_name }}.tgz"
          pnpm pack
          mv package/*.tgz "$TARBALL"
          echo "TARBALL_NAME=$TARBALL" >> $GITHUB_ENV

      - name: Create Github Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: ${{ env.TARBALL_NAME }}
          generate_release_notes: true
          make_latest: true

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-release

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v7
        with:
          repository: baenecke-it/singtonic
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26' # Specify the Node.js version needed

      - name: Install pnpm dependency
        run: |
          TAG="${{ needs.build-and-release.outputs.release_version }}"
          npm install "https://github.com/${{ github.repository }}/releases/download/${TAG}/sveltia-cms-${TAG}.tgz"

      - name: Deploy to SingTonic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(deps): update sveltia-cms to ${{ needs.build-and-release.outputs.release_version }}"
          git push
